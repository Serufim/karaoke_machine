name: Release Desktop (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS Release (.DMG)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for Vue 3 build)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv package manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies & Build macOS DMG
        run: |
          uv sync
          uv run python scripts/build_macos_dmg.py

      - name: Upload macOS Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          name: AI Karaoke Studio Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build & Package Windows Release (.exe & .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for Vue 3 build)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv package manager
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          echo "$HOME\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile Vue 3 Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Download standalone FFmpeg for Windows
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Write-Host "Downloading FFmpeg with libass..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $extractedBin = Get-ChildItem -Path "ffmpeg_extracted" -Filter "bin" -Recurse | Select-Object -First 1
          Copy-Item -Path "$($extractedBin.FullName)\ffmpeg.exe" -Destination "bin\ffmpeg.exe"
          Copy-Item -Path "$($extractedBin.FullName)\ffprobe.exe" -Destination "bin\ffprobe.exe"
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_extracted
          Get-ChildItem -Path bin

      - name: Install Python dependencies & PyInstaller
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Run PyInstaller Build
        run: |
          uv run pyinstaller packaging/windows/pyinstaller.spec --noconfirm

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Installer
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss

      - name: Create Portable ZIP
        run: |
          Compress-Archive -Path dist\AIKaraokeStudio\* -DestinationPath dist\AIKaraokeStudio-Windows-Portable.zip

      - name: Upload Windows Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          name: AI Karaoke Studio Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/installer/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
