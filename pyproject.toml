[project]
name = "karaoke-generator"
version = "0.2.0"
description = "Fully local, automatic AI karaoke video generator optimized for Russian/Cyrillic"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "demucs>=4.0.1",
    "whisper-timestamped>=1.15.4",
    "transformers>=4.40.0,<5.0.0",
    "auditok>=0.2.0",
    "yt-dlp>=2026.10.20",
    "gradio>=4.20.0",
    "pillow>=10.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "soundfile>=0.12.1",
    "numpy<2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "pywebview>=6.2.1",
]

[project.scripts]
karaoke = "karaoke.cli:main"
karaoke-app = "karaoke.desktop_app:main"
karaoke-ui = "karaoke.server:main"
karaoke-gradio = "karaoke.app_ui:main"
karaoke-server = "karaoke.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karaoke"]
